name: Checks and Android demo APK
on: [push, pull_request, workflow_dispatch]
jobs:
  flutter:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[publish-only]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: bash scripts/bootstrap.sh
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Verify APK signatures and contents
        run: |
          RAFF_APK=build/app/outputs/flutter-apk/app-release.apk
          RAFF_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$RAFF_TOOLS/apksigner" verify --verbose --print-certs "$RAFF_APK"
          "$RAFF_TOOLS/aapt" dump badging "$RAFF_APK" | sed -n '1,40p'
          "$RAFF_TOOLS/zipalign" -c -P 16 4 "$RAFF_APK"
          unzip -t "$RAFF_APK" | tail -1
          python3 scripts/check_apk_native.py "$RAFF_APK"
          sha256sum "$RAFF_APK"
      - name: Record application version for the release filename
        run: |
          RAFF_BUILD_VERSION=$(sed -n 's/^version: *//p' pubspec.yaml)
          printf '%s\n' "${RAFF_BUILD_VERSION%%+*}" > build/app/outputs/flutter-apk/apk-version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: raff-demo-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/apk-version.txt
  rules:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[publish-only]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm run test:rules

  install:
    needs: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [24, 30, 35, 36, 37]
        include:
          - api: 24
            ram: 1536M
            disk: 2048M
          - api: 37
            platform: 36
            image: '37.0'
            target: google_apis_ps16k
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: raff-demo-apk
          path: apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use SDK tools that understand Android 17.0 image metadata
        if: matrix.api != 24
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmdline-tools;22.0"
          set -o pipefail
          mv "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/cmdline-tools/pre-raff-latest"
          ln -s "$ANDROID_HOME/cmdline-tools/22.0" "$ANDROID_HOME/cmdline-tools/latest"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.platform || matrix.api }}
          system-image-api-level: ${{ matrix.image || matrix.api }}
          target: ${{ matrix.target || 'google_apis' }}
          arch: x86_64
          ram-size: ${{ matrix.ram || '4096M' }}
          disk-size: ${{ matrix.disk || '8192M' }}
          disable-animations: true
          emulator-options: -no-window -gpu ${{ matrix.api == 37 && 'software' || 'swiftshader_indirect' }} -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell getprop ro.build.version.release
            if [ "${{ matrix.api }}" != "24" ]; then adb shell getconf PAGE_SIZE; fi
            if [ "${{ matrix.api }}" = "37" ]; then test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "37"; test "$(adb shell getconf PAGE_SIZE | tr -d '\r')" = "16384"; fi
            adb install --no-streaming -r apk/app-release.apk
            adb logcat -c
            adb shell am start -W -n com.raffapp.raff/.MainActivity
            sleep 5
            adb logcat -b crash -d
            adb shell pidof com.raffapp.raff
  publish:
    needs: [flutter, rules, install]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: raff-demo-apk
          path: apk
      - name: Publish verified universal APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RAFF_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$RAFF_HEAD" != "$GITHUB_SHA" ]; then
            echo "Newer commit exists; APK remains available as an artifact."
            exit 0
          fi
          RAFF_VERSION=$(cat apk/apk-version.txt)
          RAFF_ASSET="apk/raff-$RAFF_VERSION-universal.apk"
          cp apk/app-release.apk "$RAFF_ASSET"
          RAFF_TAG="demo-${GITHUB_RUN_NUMBER}"
          gh release create "$RAFF_TAG" "$RAFF_ASSET" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "رفّ $RAFF_VERSION — الطرود والوزن وDrive" --notes "إدخال تكلفة الطرد بالسوري أو الدولار مع حساب تكلفة الوحدة تلقائياً، ومواد بالكيلوغرام وكميات كسرية في المخزون وسلة الزبون والجرد. صلاحية مستقلة للعامل لاسترجاع النسخ دون تغيير كلمة سر المدير أو صلاحياته ودون منحه تصدير النسخة أو رؤية التكلفة. حفظ وفتح Excel وJSON عبر نافذة ملفات أندرويد لاختيار Google Drive؛ يتطلب تثبيت Drive وتسجيل الدخول فيه، ولا يتضمن ربط حساب Google داخل رفّ أو مزامنة تلقائية. يحتفظ بإصلاح استيراد فهرس النصوص المكررة وفحص 1200 صنف في ورقة واحدة. Android 7 أو أحدث، ملف موحد ARM32 وARM64 وx86_64. التوقيع تجريبي وقد يختلف عن النسخة القديمة؛ احفظ JSON خارج التطبيق وتأكد منه قبل أي إزالة لنسخة تحوي بيانات. لا تشمل النسخة الاحتياطية كلمة السر أو الصلاحيات. Drive يحتاج تجربة على الهاتف الفعلي."

