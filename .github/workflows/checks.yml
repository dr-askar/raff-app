name: Checks and Android demo APK
on: [push, pull_request, workflow_dispatch]
jobs:
  flutter:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[publish-only]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Keep the demo signing key for subsequent updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: raff-demo-signing-v1
      - run: bash scripts/bootstrap.sh
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: raff-demo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish direct demo download
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/raff.apk
          RAFF_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$RAFF_HEAD" != "$GITHUB_SHA" ]; then
            echo "A newer commit exists on main. APK retained as an artifact; stale release publishing skipped."
            exit 0
          fi
          RAFF_ASSETS=(build/app/outputs/flutter-apk/raff.apk)
          RAFF_TAG="demo-${GITHUB_RUN_NUMBER}"
          if gh release view "$RAFF_TAG" >/dev/null 2>&1; then
            gh release upload "$RAFF_TAG" "${RAFF_ASSETS[@]}" --clobber
          else
            gh release create "$RAFF_TAG" "${RAFF_ASSETS[@]}" --target "$GITHUB_SHA" --prerelease --title "رفّ — نسخة تجريبية ${GITHUB_RUN_NUMBER}" --notes "APK واحد موحد لمعالجات ARM64 وARM 32 بت وx86_64. يلزم Android 7 أو أحدث. نسخة محلية لتجربة المواد والأسعار والباركود والجرد. المزامنة تحتاج إعداد Firebase للمحل. لم تختبر الكاميرا على هاتف حقيقي بعد."
          fi
  rules:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[publish-only]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm run test:rules
