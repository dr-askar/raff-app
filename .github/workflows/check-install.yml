name: Diagnose published APK installation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-install.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download the exact published file and inspect it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/raff-apk
          gh release download demo-21 --repo "$GITHUB_REPOSITORY" --pattern raff.apk --dir /tmp/raff-apk
          sha256sum /tmp/raff-apk/raff.apk
          echo 'f75f61a7e7375d30e37e21feefe28d40cf8c84351b7146d42e0a7c60ff3ba677  /tmp/raff-apk/raff.apk' | sha256sum --check
          unzip -t /tmp/raff-apk/raff.apk | tail -1
          RAFF_BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          if "$RAFF_BUILD_TOOLS/apksigner" verify --verbose --print-certs /tmp/raff-apk/raff.apk; then
            echo 'APK signature verified'
          else
            echo 'APK signature FAILED verification'
          fi
          "$RAFF_BUILD_TOOLS/aapt" dump badging /tmp/raff-apk/raff.apk | sed -n '1,25p'
          "$RAFF_BUILD_TOOLS/zipalign" -c -P 16 4 /tmp/raff-apk/raff.apk || true
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r /tmp/raff-apk/raff.apk
            adb shell monkey -p com.raffapp.raff -c android.intent.category.LAUNCHER 1
            adb shell pidof com.raffapp.raff
