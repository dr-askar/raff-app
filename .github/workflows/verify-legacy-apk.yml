name: Verify Android 7 and publish the existing tested APK
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Require successful application checks and unchanged application inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh run view 38850777908 --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = a1004ce3e5d14eb9daf05adaadf3c191e939de9f
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/38850777908/jobs?per_page=100" --jq '[.jobs[] | select(.name == "flutter" or .name == "rules" or .name == "install (30)" or .name == "install (35)" or .name == "install (36)" or .name == "install (37)")] | (length == 6 and all(.[]; .conclusion == "success"))')" = true
          git diff --exit-code a1004ce3e5d14eb9daf05adaadf3c191e939de9f HEAD -- lib test pubspec.yaml analysis_options.yaml config scripts firestore.rules
          mkdir apk
          gh run download 38850777908 --repo "$GITHUB_REPOSITORY" --name raff-demo-apk --dir apk
          echo '5f8082f3f0da213e93961d543c3b84ae4294888876e9f2854d08c48f65d5ec0c  apk/app-release.apk' | sha256sum --check
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          target: google_apis
          arch: x86_64
          ram-size: 1536M
          disk-size: 2048M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell getprop ro.build.version.release
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = 24
            adb install --no-streaming -r apk/app-release.apk
            adb logcat -c
            adb shell am start -W -n com.raffapp.raff/.MainActivity
            sleep 5
            adb logcat -b crash -d
            adb shell pidof com.raffapp.raff
      - name: Publish only after all required checks passed on this exact APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RAFF_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$RAFF_HEAD" != "$GITHUB_SHA" ]; then
            echo 'Newer commit exists; release publishing skipped.'
            exit 0
          fi
          cp apk/app-release.apk apk/raff-0.3.2-universal.apk
          cp docs/RELEASE_0.3.2.md apk/release-notes.md
          printf '\nفحص أندرويد 7 والنشر: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> apk/release-notes.md
          if gh release view demo-36 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload demo-36 apk/raff-0.3.2-universal.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit demo-36 --repo "$GITHUB_REPOSITORY" --notes-file apk/release-notes.md
          else
            gh release create demo-36 apk/raff-0.3.2-universal.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'رفّ 0.3.2 — استيراد ومساومة' --notes-file apk/release-notes.md
          fi
