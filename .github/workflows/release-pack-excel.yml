name: Sign and release pack Excel update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-pack-excel.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  RAFF_SOURCE: d9b9096022e671b7d7500f20e7990c42a072da9e
  RAFF_SOURCE_RUN: '39052246878'
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cancel obsolete release attempt before receiving a key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh run view 39052300117 --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = d2958a1fffde110472b66c47653d2fc1c30d468c ]; then
            gh run cancel 39052300117 --repo "$GITHUB_REPOSITORY" || true
          fi
      - name: Wait for all source checks and download tested bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view "$RAFF_SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$RAFF_SOURCE"
          gh run watch "$RAFF_SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15
          git diff --exit-code "$RAFF_SOURCE" HEAD -- lib test pubspec.yaml analysis_options.yaml firestore.rules scripts/bootstrap.sh scripts/configure_android.py config/firebase.example.json
          RAFF_ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RAFF_SOURCE_RUN/artifacts" --jq '.artifacts[] | select(.name == "raff-demo-apk") | .id')
          test -n "$RAFF_ARTIFACT_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RAFF_ARTIFACT_ID/zip" > "$RUNNER_TEMP/source.zip"
          RAFF_ARTIFACT_DIGEST=$(sha256sum "$RUNNER_TEMP/source.zip" | cut -d' ' -f1)
          echo "RAFF_ARTIFACT_DIGEST=$RAFF_ARTIFACT_DIGEST" >> "$GITHUB_ENV"
          echo "Approved artifact $RAFF_ARTIFACT_ID digest $RAFF_ARTIFACT_DIGEST"
          mkdir -p source apk ci-only dist
          unzip -q "$RUNNER_TEMP/source.zip" -d source
          test "$(cat source/apk-version.txt)" = 0.4.2
          gh release download v0.4.1 --repo "$GITHUB_REPOSITORY" --pattern raff-0.4.1.apk --dir ci-only
          echo '5857b79d51300d3de282dd4454d0fab6a74e1c9c21bdb7d0fd2f703d817f6926  ci-only/raff-0.4.1.apk' | sha256sum --check
          mv ci-only/raff-0.4.1.apk ci-only/baseline.apk
          gh release download install-helper-v1 --repo "$GITHUB_REPOSITORY" --pattern raff-install-helper.apk --dir ci-only
          echo '56a1d7a3c8558aec64a4f289b588f1da0a48de50ffd58776aa86a237230cd62a  ci-only/raff-install-helper.apk' | sha256sum --check
          mv ci-only/raff-install-helper.apk ci-only/baseline-helper.apk
      - name: Verify signing protocol and open one-use session
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install 'cryptography>=46.0.3,<51'
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
          umask 077
          python3 scripts/signing/envelope.py recipient --directory "$RUNNER_TEMP/raff-sign" --pin config/android-release-cert.sha256 --session "$GITHUB_RUN_ID" --head "$GITHUB_SHA" --source "$RAFF_SOURCE" --artifact-digest "$RAFF_ARTIFACT_DIGEST"
          python3 scripts/signing/ci_session.py
          python3 scripts/signing/envelope.py open --directory "$RUNNER_TEMP/raff-sign" --pin config/android-release-cert.sha256 --session "$GITHUB_RUN_ID" --head "$GITHUB_SHA" --source "$RAFF_SOURCE" --artifact-digest "$RAFF_ARTIFACT_DIGEST" --input "$RUNNER_TEMP/raff-sign/request.json"
      - name: Sign the tested application and build matching helper
        run: |
          set -euo pipefail
          RAFF_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$RAFF_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/raff-sign/release.p12" --ks-key-alias raff-release --ks-pass "file:$RUNNER_TEMP/raff-sign/password.txt" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false --out apk/raff-0.4.2.apk source/app-release.apk
          "$RAFF_TOOLS/apksigner" verify --verbose --print-certs apk/raff-0.4.2.apk | tee "$RUNNER_TEMP/cert.txt"
          RAFF_ANDROID_CERT_SHA256=$(cat config/android-release-cert.sha256) python3 scripts/release_signing.py verify "$RUNNER_TEMP/cert.txt"
          "$RAFF_TOOLS/apksigner" verify --verbose --print-certs ci-only/baseline.apk | tee "$RUNNER_TEMP/baseline-cert.txt"
          RAFF_ANDROID_CERT_SHA256=$(cat config/android-release-cert.sha256) python3 scripts/release_signing.py verify "$RUNNER_TEMP/baseline-cert.txt"
          "$RAFF_TOOLS/zipalign" -c -P 16 4 apk/raff-0.4.2.apk
          unzip -t apk/raff-0.4.2.apk | tail -1
          python3 scripts/check_apk_native.py apk/raff-0.4.2.apk
          python3 scripts/signing/check_payload.py source/app-release.apk apk/raff-0.4.2.apk
          "$RAFF_TOOLS/aapt" dump badging apk/raff-0.4.2.apk | head -30
          RAFF_APP_DIGEST=$(sha256sum apk/raff-0.4.2.apk | cut -d' ' -f1)
          RAFF_RELEASE_KEYSTORE="$RUNNER_TEMP/raff-sign/release.p12" RAFF_PASSWORD_FILE="$RUNNER_TEMP/raff-sign/password.txt" RAFF_APP_VERSION=0.4.2 RAFF_APP_CODE=10 RAFF_APP_DIGEST="$RAFF_APP_DIGEST" RAFF_HELPER_CODE=2 RAFF_EMBEDDED_APK="$GITHUB_WORKSPACE/apk/raff-0.4.2.apk" bash tools/install-helper/build.sh
          cp apk/raff-0.4.2.apk dist/
          cp helper-apk/raff-install-helper.apk dist/raff-install-helper-0.4.2.apk
          cp helper-apk/ci-only-future.apk ci-only/
          cp config/android-release-cert.sha256 dist/certificate-sha256.txt
          cd dist
          sha256sum *.apk | tee SHA256SUMS.txt
      - name: Destroy temporary private signing material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/raff-sign"
      - uses: actions/upload-artifact@v4
        with:
          name: pack-excel-signed-release
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: pack-excel-ci-only-baseline-and-fixture
          retention-days: 1
          path: ci-only/
  device-flow:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [30, 37]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pack-excel-signed-release
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: pack-excel-ci-only-baseline-and-fixture
          path: apk
      - run: |
          cp apk/raff-0.4.2.apk apk/candidate.apk
          cp apk/raff-install-helper-0.4.2.apk apk/raff-install-helper.apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Current SDK tools
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'cmdline-tools;22.0'
          set -o pipefail
          mv "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/cmdline-tools/pre-raff-latest"
          ln -s "$ANDROID_HOME/cmdline-tools/22.0" "$ANDROID_HOME/cmdline-tools/latest"
      - name: Enable acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          RAFF_TEST_APP_CODE: '10'
        with:
          api-level: ${{ matrix.api == 37 && 36 || matrix.api }}
          system-image-api-level: ${{ matrix.api == 37 && '37.0' || matrix.api }}
          target: ${{ matrix.api == 37 && 'google_apis_ps16k' || 'google_apis' }}
          arch: x86_64
          ram-size: 4096M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-window -gpu ${{ matrix.api == 37 && 'software' || 'swiftshader_indirect' }} -noaudio -no-boot-anim -camera-back none
          script: python3 tools/install-helper/tests/device_flow.py
  publish:
    needs: [sign, device-flow]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pack-excel-signed-release
          path: apk
      - name: Publish exact tested files and mirror program APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          cd apk
          sha256sum --check SHA256SUMS.txt
          gh release create v0.4.2 raff-0.4.2.apk raff-install-helper-0.4.2.apk SHA256SUMS.txt certificate-sha256.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'رفّ 0.4.2 — إكسل بالطرود والكيلو' --notes-file ../docs/RELEASE_0.4.2.md
          cp raff-0.4.2.apk raff.apk
          gh release upload demo-universal raff.apk --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit demo-universal --repo "$GITHUB_REPOSITORY" --title 'رفّ 0.4.2 — إكسل بالطرود والكيلو' --notes-file ../docs/RELEASE_0.4.2.md
