name: Mirror signed Raff APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-apk.yml', 'docs/RELEASE_0.4.1.md']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror exact signed bytes after successful install and update checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 38960586958 --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = 1775df9b253527fe698bcdab7743688e4420aeee
          test "$(gh run view 38960586958 --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          git diff --exit-code 1775df9b253527fe698bcdab7743688e4420aeee HEAD -- lib test pubspec.yaml analysis_options.yaml config scripts firestore.rules
          RAFF_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$RAFF_HEAD" = "$GITHUB_SHA"
          mkdir -p apk
          gh release download v0.4.1 --repo "$GITHUB_REPOSITORY" --pattern raff-0.4.1.apk --dir apk
          echo '5857b79d51300d3de282dd4454d0fab6a74e1c9c21bdb7d0fd2f703d817f6926  apk/raff-0.4.1.apk' | sha256sum --check
          cp apk/raff-0.4.1.apk apk/raff.apk
          gh release upload demo-universal apk/raff.apk --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit demo-universal --repo "$GITHUB_REPOSITORY" --title 'رفّ 0.4.1 — توقيع ثابت' --notes-file docs/RELEASE_0.4.1.md
