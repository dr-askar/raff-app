name: Publish tested universal APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-apk.yml', 'docs/RELEASE_0.4.0.md']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror the exact published APK after validating the successful release run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh run view 38918624792 --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = d4fa5c98057017b82f503bc327aa4f8a556b7071
          test "$(gh run view 38918624792 --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          git diff --exit-code d4fa5c98057017b82f503bc327aa4f8a556b7071 HEAD -- lib test pubspec.yaml analysis_options.yaml config scripts firestore.rules
          RAFF_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$RAFF_HEAD" = "$GITHUB_SHA"
          mkdir -p apk
          gh run download 38918624792 --repo "$GITHUB_REPOSITORY" --name raff-demo-apk --dir apk
          test "$(cat apk/apk-version.txt)" = 0.4.0
          echo '8f5647916554a2477a1f8f184a40e140410db4ca4ab23c725911bf952760f542  apk/app-release.apk' | sha256sum --check
          cp apk/app-release.apk apk/raff.apk
          gh release edit demo-56 --repo "$GITHUB_REPOSITORY" --notes-file docs/RELEASE_0.4.0.md
          gh release upload demo-universal apk/raff.apk --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit demo-universal --repo "$GITHUB_REPOSITORY" --title 'رفّ 0.4.0 — الطرود والوزن وDrive' --notes-file docs/RELEASE_0.4.0.md
