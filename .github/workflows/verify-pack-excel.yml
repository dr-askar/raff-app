name: Verify frozen pack Excel release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-pack-excel.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require successful source checks, fixed signing and API 30 upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 39052246878 --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = d9b9096022e671b7d7500f20e7990c42a072da9e
          test "$(gh run view 39052246878 --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view 39052379257 --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = 9729107157b2b0aeab7d48581a61a7103e6f220c
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39052379257/jobs" > "$RUNNER_TEMP/approved-jobs.json"
          python3 - "$RUNNER_TEMP/approved-jobs.json" <<'PY'
          import json, sys
          jobs = json.load(open(sys.argv[1]))['jobs']
          for name in ['sign', 'device-flow (30)']:
              assert any(j['name'] == name and j['conclusion'] == 'success' for j in jobs), name
          PY
          git diff --exit-code 9729107157b2b0aeab7d48581a61a7103e6f220c HEAD -- lib test pubspec.yaml config scripts tools/install-helper/src tools/install-helper/build.sh
      - uses: actions/download-artifact@v4
        with:
          name: pack-excel-signed-release
          path: apk
          run-id: 39052379257
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: pack-excel-ci-only-baseline-and-fixture
          path: apk
          run-id: 39052379257
          github-token: ${{ github.token }}
      - name: Pin exact already signed files
        run: |
          echo 'e3794d44a5c9d4490b9b59e8ee79e633cbdc3e15947f76aba186f336590d6954  apk/raff-0.4.2.apk' | sha256sum --check
          echo '578f35743182d12eb9b0ba1e4dac2447c653ab50c7baaf6df5e9cf8e9552a1e0  apk/raff-install-helper-0.4.2.apk' | sha256sum --check
          echo '5857b79d51300d3de282dd4454d0fab6a74e1c9c21bdb7d0fd2f703d817f6926  apk/baseline.apk' | sha256sum --check
          echo '56a1d7a3c8558aec64a4f289b588f1da0a48de50ffd58776aa86a237230cd62a  apk/baseline-helper.apk' | sha256sum --check
          cp apk/raff-0.4.2.apk apk/candidate.apk
          cp apk/raff-install-helper-0.4.2.apk apk/raff-install-helper.apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Current SDK tools
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'cmdline-tools;22.0'
          set -o pipefail
          mv "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/cmdline-tools/pre-raff-latest"
          ln -s "$ANDROID_HOME/cmdline-tools/22.0" "$ANDROID_HOME/cmdline-tools/latest"
      - name: Enable acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          RAFF_TEST_APP_CODE: '10'
        with:
          api-level: 36
          system-image-api-level: '37.0'
          target: google_apis_ps16k
          arch: x86_64
          ram-size: 4096M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-window -gpu software -noaudio -no-boot-anim -camera-back none
          script: python3 tools/install-helper/tests/device_flow.py
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pack-excel-signed-release
          path: apk
          run-id: 39052379257
          github-token: ${{ github.token }}
      - name: Publish the frozen verified program and helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          cd apk
          sha256sum --check SHA256SUMS.txt
          test "$(sha256sum raff-0.4.2.apk | cut -d' ' -f1)" = e3794d44a5c9d4490b9b59e8ee79e633cbdc3e15947f76aba186f336590d6954
          test "$(sha256sum raff-install-helper-0.4.2.apk | cut -d' ' -f1)" = 578f35743182d12eb9b0ba1e4dac2447c653ab50c7baaf6df5e9cf8e9552a1e0
          gh release create v0.4.2 raff-0.4.2.apk raff-install-helper-0.4.2.apk SHA256SUMS.txt certificate-sha256.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'رفّ 0.4.2 — إكسل بالطرود والكيلو' --notes-file ../docs/RELEASE_0.4.2.md
          cp raff-0.4.2.apk raff.apk
          gh release upload demo-universal raff.apk --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit demo-universal --repo "$GITHUB_REPOSITORY" --title 'رفّ 0.4.2 — إكسل بالطرود والكيلو' --notes-file ../docs/RELEASE_0.4.2.md
